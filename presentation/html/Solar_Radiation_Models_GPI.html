<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Temperature-Based Solar Radiation Models - GPI</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#070d1a;--ink:#e9eef7;--mut:#8fa0bd;--line:#22304b;--ah:#f0a53a;--am:#3cc3b0;--ok:#8b9cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03060d;overflow:hidden;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--ink)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(1200px 700px at 85% -10%,#1a2c52 0,transparent 60%),radial-gradient(900px 600px at 0 110%,#14233f 0,transparent 55%),var(--bg);overflow:hidden}
.s{position:absolute;left:0;top:0;right:0;bottom:0;padding:60px 96px 76px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .45s ease,visibility 0s .45s}
.s.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .55s ease}
.kick{font-size:22px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:400;font-size:60px;line-height:1.1;margin:10px 0 24px;max-width:1560px}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:34px;margin:0 0 10px}
p,li{font-size:28px;line-height:1.4;color:#c6d1e6;margin:0 0 12px}.sm{font-size:22px;color:var(--mut)}
.mono{font-family:Consolas,"Courier New",monospace}
.on [data-i]{animation:rise .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*.1s + .12s)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.card{background:linear-gradient(160deg,#122042,#0c1730);border:1px solid var(--line);border-radius:18px;padding:24px 28px}
.row{display:flex;gap:28px}.col{display:flex;flex-direction:column}.c{align-items:center;justify-content:center}.g{flex:1;min-width:0}
.big{font-family:Georgia,"Times New Roman",serif;font-size:150px;line-height:1;color:#fff}.acc{color:#ffc15a}
.chip{display:inline-block;padding:4px 14px;border-radius:999px;border:1px solid var(--line);font-size:22px;margin:3px}
.arrow{font-size:44px;color:#5b7bb8}
.tip{position:fixed;left:0;top:0;z-index:9;pointer-events:none;background:#0a1226f2;border:1px solid #3a4f7a;border-radius:10px;padding:10px 14px;font-size:18px;line-height:1.35;max-width:520px;opacity:0;transition:opacity .15s;color:#e9eef7}
#bar{position:fixed;left:0;bottom:0;height:5px;background:linear-gradient(90deg,#f0a53a,#3cc3b0,#8b9cff);transition:width .5s;z-index:5;width:0}
#num{position:fixed;right:22px;bottom:14px;font-size:16px;color:#9fb0cc;z-index:5;letter-spacing:.1em}
.nav{position:fixed;bottom:10px;left:20px;z-index:5;display:flex;gap:8px}
.nav button{background:#0f1930;color:#d5e3f5;border:1px solid #2a3c60;border-radius:8px;padding:6px 14px;cursor:pointer;font-size:15px;font-family:inherit}
.nav button:hover{border-color:#ffd37a}
.pill{display:flex;align-items:center;gap:14px;background:#0e1a35;border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:26px}
.mid{display:inline-block;min-width:60px;text-align:center;border-radius:8px;padding:1px 8px;font-weight:700;color:#07101f}
.step{flex:1;text-align:center;min-width:0}.step .card{height:100%}
.hm{border-collapse:separate;border-spacing:3px}
.hm td,.hm th{font-size:20px;text-align:center;height:41px;width:76px;border-radius:5px;color:#fff;font-weight:400}
.hm th{color:var(--mut);font-size:17px}.hm td.l{width:70px;text-align:left;background:none;font-weight:700}
.on .hm td:not(.l){animation:cellin .5s ease both;animation-delay:calc(.35s + var(--d,0ms))}
@keyframes cellin{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
.rcard{border-radius:14px;padding:18px 18px;font-size:26px;background:#0f1a36;border:1px solid var(--line);margin-bottom:12px;transition:transform .25s,border-color .25s}
.rcard.f,.rcard:hover{border-color:#ffd37a;transform:translateX(5px)}
.ecard{position:relative;background:#0f1a36;border:1px solid var(--line);border-radius:14px;padding:18px 24px;transition:border-color .25s;min-width:0}
.ecard:hover{border-color:#ffd37a}.ecard .x{display:none;font-size:18px;color:var(--mut);margin-top:6px}.ecard:hover .x{display:block}
.flag{display:inline-block;font-size:17px;border:1px solid #ffc15a;color:#ffc15a;border-radius:999px;padding:1px 12px;margin-left:10px;letter-spacing:.02em;white-space:nowrap}
.ln{stroke-dasharray:1;stroke-dashoffset:1}.on .ln{animation:draw 1.6s ease forwards;animation-delay:calc(.4s + var(--o))}
@keyframes draw{to{stroke-dashoffset:0}}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}.on .bar{animation:up .9s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.5s + var(--o))}
@keyframes up{to{transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.mapw{overflow:hidden;border-radius:16px;border:1px solid var(--line)}
canvas{display:block}
a.dash{color:#ffc15a;text-decoration:none;border-bottom:2px solid #ffc15a66}a.dash:hover{border-bottom-color:#ffc15a}
/* math */
.m{font-family:"Cambria Math","STIX Two Math","Times New Roman",Georgia,serif;color:#fff;white-space:nowrap}
.m sub,.m sup{font-size:.62em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em}
.fr>span:first-child{border-bottom:.07em solid currentColor;padding:0 .22em .06em}.fr>span:last-child{padding:.06em .22em 0}
.rt{display:inline-flex;align-items:stretch;vertical-align:middle;margin:0 .12em}
.rd{display:flex;align-items:flex-end;font-size:1.3em;line-height:.85;padding-right:.04em}
.rt.tall .rd{font-size:2.5em;line-height:.8}
.ov{border-top:.07em solid currentColor;padding:.06em .1em 0 .12em;margin-top:.2em;display:flex;align-items:center;gap:.15em}
.sg{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .15em}
.sg>span:first-child,.sg>span:last-child{font-size:.5em;min-height:.5em}.sgs{font-size:1.5em}
.bp{font-size:1.7em;line-height:.8;vertical-align:middle;font-weight:200}
.asm{font-size:19px;color:#ffc15a;margin-top:6px}

</style></head>
